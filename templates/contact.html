<!-- templates/contact.html -->
{% extends "base.html" %}

{% block title %}Contact — {{ site_name }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-8">
    <div class="border-b border-gray-100 pb-6">
        <h1 class="text-3xl font-bold text-gray-900">Get in Touch</h1>
        <p class="text-sm text-gray-600 mt-1">Have a question or proposal? Send a message below.</p>
    </div>

    <form action="{{ url_for('contact') }}" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Name</label>
            <input type="text" name="name" required class="w-full px-4 py-2 text-xs border border-gray-200 rounded focus:outline-none focus:border-[#7cffcb]">
        </div>
        <div>
            <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Email</label>
            <input type="email" name="email" required class="w-full px-4 py-2 text-xs border border-gray-200 rounded focus:outline-none focus:border-[#7cffcb]">
        </div>
        <div>
            <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Message</label>
            <textarea name="message" rows="5" required class="w-full px-4 py-2 text-xs border border-gray-200 rounded focus:outline-none focus:border-[#7cffcb]"></textarea>
        </div>
        <button type="submit" class="w-full py-3 bg-[#7cffcb] text-gray-900 text-xs font-bold rounded hover:opacity-90 transition">
            Send Message
        </button>
    </form>
</div>
{% endblock %}
