<!-- templates/admin/login.html -->
{% extends "base.html" %}

{% block title %}Login — {{ site_name }}{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex flex-col justify-center items-center px-4 py-12">
    <div class="w-full max-w-md p-8 bg-white border border-gray-100 rounded-xl shadow-lg space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-bold tracking-tight text-gray-900">Sign In</h1>
            <p class="text-xs text-gray-500">Welcome back! Please enter your details.</p>
        </div>
        
        <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
            
            <!-- Username Input -->
            <div>
                <label for="username" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    required 
                    placeholder="Enter your username"
                    class="w-full px-3.5 py-2.5 text-sm text-gray-900 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#7cffcb] focus:border-transparent focus:bg-white transition"
                >
            </div>
            
            <!-- Password Input -->
            <div>
                <label for="password" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Password</label>
                <div class="relative flex items-center">
                    <input 
                        type="password" 
                        name="password" 
                        id="password" 
                        required 
                        placeholder="••••••••"
                        class="w-full pl-3.5 pr-10 py-2.5 text-sm text-gray-900 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#7cffcb] focus:border-transparent focus:bg-white transition"
                    >
                    <button 
                        type="button" 
                        id="eye-span" 
                        class="absolute right-3 text-gray-400 hover:text-gray-600 focus:outline-none p-1 transition"
                        aria-label="Toggle password visibility"
                    >
                        <i class="fas fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Primary Action -->
            <button 
                type="submit" 
                onclick="setLoginDate()"
                class="w-full py-2.5 bg-[#7cffcb] hover:bg-[#68ecc1] text-gray-900 text-sm font-semibold rounded-lg shadow-sm transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#7cffcb]"
            >
                Sign In
            </button>

            <!-- Divider -->
            <div class="relative flex items-center justify-center my-4">
                <div class="border-t border-gray-200 w-full"></div>
                <span class="bg-white px-3 text-xs text-gray-400 uppercase tracking-wider">or</span>
                <div class="border-t border-gray-200 w-full"></div>
            </div>

            <!-- Social Login (Google) -->
            <div>
                <a 
                    href="/google/login?next=/" 
                    class="w-full flex items-center justify-center gap-2 py-2.5 border border-gray-200 rounded-lg text-xs font-semibold text-gray-700 bg-white hover:bg-gray-50 transition shadow-xs"
                >
                    <i class="fab fa-google text-red-500 text-sm"></i>
                    <span>Continue with Google</span>
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const eye = document.getElementById('eye-span');
        const passwordInput = document.getElementById('password');

        if (eye && passwordInput) {
            eye.addEventListener('click', () => {
                const icon = eye.querySelector('i');
                const isPassword = passwordInput.type === 'password';

                passwordInput.type = isPassword ? 'text' : 'password';
                icon.className = isPassword ? 'fas fa-eye-slash text-sm' : 'fas fa-eye text-sm';
            });
        }
    });

    function setLoginDate() {
        localStorage.setItem('logged_in', 'true');
    }
</script>
{% endblock %}
