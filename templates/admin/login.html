<!-- templates/admin/login.html -->
{% extends "base.html" %}

{% block title %}Admin Login — {{ site_name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="p-8 border border-gray-100 rounded-lg shadow-xs bg-white space-y-6">
        <h1 class="text-xl font-bold text-gray-900 text-center uppercase tracking-wider">Admin Login</h1>
        
        <form action="{{ url_for('admin.login') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Username</label>
                <input type="text" name="username" required class="w-full px-4 py-2 text-xs border border-gray-200 rounded focus:outline-none focus:border-[#7cffcb]">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Password</label>
                <div class="inp-grp relative">
                <input type="password" name="password" id="password" required class="w-full px-4 py-2 text-xs border border-gray-200 rounded focus:outline-none focus:border-[#7cffcb]">

                <span class="cursor-pointer password-eye absolute right-[15px] top-[5px] " id="eye-span" >
                    <i class="fas fa-eye"></i>
                </span>

                </div>
            </div>
            <script>
                document.addEventListener('DOMContentLoaded', ()=>{

                    const eye = document.getElementById('eye-span')

                    eye.addEventListener('click', ()=>{
                        const pasword = document.getElementById('password')
                        const span = eye.querySelector('i')

                        if(pasword.type == 'password'){
                            pasword.type = 'text'
                            
                            span.classList = 'fas fa-eye-slash'
                        } else{
                            pasword.type = 'password'
                            span.classList = 'fas fa-eye'
                        }
                    })
                })

                function setLoginDate(){
                    localStorage.setItem('logged_in', true)
                }
                
            </script>
            <button type="submit" class="w-full py-2 bg-[#7cffcb] text-gray-900 text-xs font-bold rounded hover:opacity-90 transition" onclick="setLoginDate()">
                Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
