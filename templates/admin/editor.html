<!-- templates/admin/editor.html -->
{% extends "base.html" %}

{% block title %}{% if article %}Edit Article{% else %}New Article{% endif %} — {{ site_name }}{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div class="flex items-center justify-between border-b border-gray-100 pb-4">
        <h1 class="text-2xl font-bold text-gray-900">
            {% if article %}Edit Article{% else %}Create New Article{% endif %}
        </h1>
        <a href="{{ url_for('admin.dashboard') }}" class="text-xs text-gray-500 hover:underline">&larr; Back to Dashboard</a>
    </div>

    <div class="bg-white border border-gray-100 rounded-lg p-4 space-y-3">
        <div class="text-xs text-gray-500 font-medium">Get Image Link</div>
        <form id="getImageLinkForm">
            <input type="file" id="fileInput" accept="image/*" class="hidden">
            <div id="previewContainer" class="relative hidden">
                <img id="previewImage" class="w-full max-h-64 object-contain rounded border border-gray-100">
                <button type="submit" id="uploadButton" class="absolute bottom-3 right-3 px-4 py-2 bg-[#7cffcb] text-gray-900 text-xs font-bold rounded">
                    <i class="fas fa-upload"></i> Upload
                </button>
            </div>
            <button type="button" id="browseButton" class="px-4 py-2 bg-[#7cffcb] text-gray-900 text-xs font-bold rounded">
                <i class="fas fa-file-upload"></i> Browse
            </button>
        </form>
        <div class="flex gap-2">
            <input id="imageLink" readonly class="flex-1 px-3 py-2 text-xs bg-gray-50 border border-gray-100 rounded">
            <button type="button" id="copyButton" class="px-4 py-2 bg-[#7cffcb] text-gray-900 text-xs font-bold rounded"><i class="fas fa-copy"></i> Copy</button>
        </div>
    </div>
    
    <script>
    const form=document.getElementById('getImageLinkForm'),input=document.getElementById('fileInput'),preview=document.getElementById('previewImage'),container=document.getElementById('previewContainer'),browse=document.getElementById('browseButton'),upload=document.getElementById('uploadButton'),link=document.getElementById('imageLink'),copy=document.getElementById('copyButton')
    
    browse.onclick=()=>input.click()
    
    input.onchange=()=>{
        if(!input.files[0])return
        preview.src=URL.createObjectURL(input.files[0])
        container.classList.remove('hidden')
        browse.classList.add('hidden')
    }
    
    form.onsubmit=e=>{
        e.preventDefault()
        if(!input.files[0])return input.click()
        const reader=new FileReader()
        upload.disabled=true
        upload.innerHTML='<i class="fas fa-spinner fa-spin"></i> Uploading'
        reader.onload=e=>fetch('{{ url_for("admin.upload_image") }}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({base64Image:e.target.result})})
        .then(r=>r.json()).then(data=>{if(data.success)link.value=location.origin+data.url;else alert(data.error||'Upload failed')})
        .catch(()=>alert('Upload failed')).finally(()=>{upload.disabled=false;upload.innerHTML='<i class="fas fa-upload"></i> Upload'})
        reader.readAsDataURL(input.files[0])
    }
    
    copy.onclick=()=>{
        if(!link.value)return
        navigator.clipboard.writeText(link.value)
        copy.innerHTML='<i class="fas fa-check"></i> Copied'
        setTimeout(()=>copy.innerHTML='<i class="fas fa-copy"></i> Copy',1500)
    }
    </script>


        <form method="POST" enctype="multipart/form-data" class="space-y-6">
        
        <div>
            <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Title</label>
            <input type="text" name="title" value="{{ article.title if article else '' }}" required class="w-full px-4 py-2 text-sm border border-gray-200 rounded focus:outline-none focus:border-[#7cffcb]">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Category</label>
                <select name="category_id" required class="w-full px-4 py-2 text-xs border border-gray-200 rounded focus:outline-none focus:border-[#7cffcb]">
                    {% for category in categories %}
                    <option value="{{ category.id }}" {% if article and article.category_id == category.id %}selected{% endif %}>
                        {{ category.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Status</label>
                <select name="status" class="w-full px-4 py-2 text-xs border border-gray-200 rounded focus:outline-none focus:border-[#7cffcb]">
                    <option value="published" {% if article and article.status == 'published' %}selected{% endif %}>Published</option>
                    <option value="draft" {% if article and article.status == 'draft' %}selected{% endif %}>Draft</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Summary</label>
            <textarea name="summary" rows="2" required class="w-full px-4 py-2 text-xs border border-gray-200 rounded focus:outline-none focus:border-[#7cffcb]">{{ article.summary if article else '' }}</textarea>
        </div>

        <div>
            <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Content (Markdown)</label>
            <textarea name="content_markdown" rows="14" required class="w-full p-4 font-mono text-xs border border-gray-200 rounded focus:outline-none focus:border-[#7cffcb]">{{ article.content_markdown if article else '' }}</textarea>
        </div>

        <div class="flex items-center space-x-2">
            <input type="checkbox" name="is_featured" id="is_featured" {% if article and article.is_featured %}checked{% endif %} class="rounded border-gray-300">
            <label for="is_featured" class="text-xs font-bold text-gray-700">Feature this article on homepage</label>
        </div>

        <div>
            <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Featured Image</label>
            <input type="file" name="featured_image" class="text-xs text-gray-500">
        </div>

        <button type="submit" class="px-6 py-2 bg-[#7cffcb] text-gray-900 text-xs font-bold rounded hover:opacity-90 transition">
            Save Article
        </button>
    </form>
</div>
{% endblock %}
