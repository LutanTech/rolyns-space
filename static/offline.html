<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7cffcb">
  <title>You're offline — Jerry Rolyns Space</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #fff; color: #111827; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
    main { max-width: 34rem; padding: 2rem; text-align: center; }
    .mark { display: grid; place-items: center; width: 3.5rem; height: 3.5rem; margin: 0 auto 1.25rem; border-radius: .5rem; background: #7cffcb; font-size: 1.5rem; font-weight: 800; }
    h1 { margin: 0 0 .75rem; font-size: 1.75rem; }
    p { color: #4b5563; line-height: 1.6; }
    button { margin-top: .75rem; padding: .7rem 1rem; border: 0; border-radius: .375rem; background: #059669; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #064e3b; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">J</div>
    <h1>You're offline</h1>
    <p>Jerry Rolyns Space needs an internet connection to load this page. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
