<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" width="100%" height="100%">
  <defs>
    <!-- Dark Radial Background -->
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Mint Gradient -->
    <linearGradient id="mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7ffeb" />
      <stop offset="50%" stop-color="#7cffcb" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Glass Fill -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7cffcb" stop-opacity="0.02" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1600" height="1600" rx="320" fill="url(#bg)" />

  <!-- Orbit / Ring Accents -->
  <g opacity="0.2">
    <circle cx="800" cy="740" r="580" fill="none" stroke="#7cffcb" stroke-width="3" stroke-dasharray="12 20" />
    <circle cx="800" cy="740" r="500" fill="none" stroke="#7cffcb" stroke-width="2" />
  </g>

  <g filter="url(#dropShadow)">
    <!-- OPEN BOOK STRUCTURE -->
    <!-- Left Page -->
    <path d="M 800 960 C 660 880 460 880 320 940 L 320 560 C 460 500 660 500 800 580 Z" 
          fill="url(#glass)" stroke="#7cffcb" stroke-opacity="0.4" stroke-width="4" />
    
    <!-- Right Page -->
    <path d="M 800 960 C 940 880 1140 880 1280 940 L 1280 560 C 1140 500 940 500 800 580 Z" 
          fill="url(#glass)" stroke="#7cffcb" stroke-opacity="0.4" stroke-width="4" />

    <!-- Spine -->
    <line x1="800" y1="580" x2="800" y2="960" stroke="#7cffcb" stroke-opacity="0.6" stroke-width="6" />

    <!-- JR MONOGRAM MARK -->
    <!-- Letter J -->
    <path d="M 640 440 L 640 800 C 640 900 560 940 460 940 C 390 940 330 900 310 840" 
          fill="none" stroke="url(#mint)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Letter R -->
    <path d="M 860 920 L 860 440 L 1060 440 C 1150 440 1220 500 1220 590 C 1220 680 1150 740 1060 740 L 860 740 M 1040 740 L 1210 920" 
          fill="none" stroke="url(#mint)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Core Bevel Lines -->
    <path d="M 640 440 L 640 800 C 640 900 560 940 460 940 C 390 940 330 900 310 840" 
          fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="8" stroke-linecap="round" />

    <path d="M 860 920 L 860 440 L 1060 440 C 1150 440 1220 500 1220 590 C 1220 680 1150 740 1060 740 L 860 740 M 1040 740 L 1210 920" 
          fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="8" stroke-linecap="round" />

    <!-- FOUNTAIN PEN NIB -->
    <path d="M 800 290 L 860 410 L 740 410 Z" fill="url(#mint)" />
    <circle cx="800" cy="360" r="8" fill="#0f172a" />
    <line x1="800" y1="290" x2="800" y2="352" stroke="#0f172a" stroke-width="4" />
  </g>

  <!-- BRAND TYPOGRAPHY (Converted to Safe Standard System Stack) -->
  <text x="800" y="1250" 
        text-anchor="middle" 
        fill="#f8fafc" 
        font-family="Georgia, serif" 
        font-size="56" 
        font-weight="bold" 
        letter-spacing="16">JERRY ROLYNS SPACE</text>

  <text x="800" y="1320" 
        text-anchor="middle" 
        fill="#7cffcb" 
        font-family="Arial, sans-serif" 
        font-size="24" 
        font-weight="600" 
        letter-spacing="12" 
        opacity="0.85">PERSONAL PUBLICATION</text>
</svg>
