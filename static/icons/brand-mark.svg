<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Jerry Rolyns Space monogram</title>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17243b"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8ffe3"/>
      <stop offset="1" stop-color="#57e5b2"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#night)"/>
  <!-- Orbit: a subtle nod to the site's “Space” identity. -->
  <ellipse cx="31.5" cy="34" rx="23.5" ry="11.5" transform="rotate(-34 31.5 34)"
           fill="none" stroke="url(#mint)" stroke-width="2.4" opacity=".9"/>
  <!-- Open, geometric J monogram. -->
  <path d="M24 16.5h17.5M36.5 16.5v24.2c0 7.6-4.2 11.8-11 11.8-4.7 0-8-2.2-10-6.3"
        fill="none" stroke="#f4f8ff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Orbiting point and editorial star. -->
  <circle cx="11.6" cy="45.1" r="2.5" fill="#7cffcb"/>
  <path d="M49 9.5l1.35 3.65L54 14.5l-3.65 1.35L49 19.5l-1.35-3.65L44 14.5l3.65-1.35z"
        fill="#ffd37a"/>
</svg>
